# iosevka-n
[buildPlans.iosevka-n]
family = "Iosevka N"
desc = "Default"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = true

[buildPlans.iosevka-n.variants.design]
six = "closed-contour"
nine = "closed-contour"
f = "flat-hook-serifless"
j = "flat-hook-serifed"
t = "flat-hook"
asterisk = "penta-low"
percent = "rings-continuous-slash"
decorative-angle-brackets = "middle"

[buildPlans.iosevka-n.variants.italic]
a = "double-storey-serifless"
d = "toothed-serifless"
e = "flat-crossbar"
i = "serifed"
k = "straight-serifless"
l = "serifed"
u = "toothed-serifless"
y = "straight-serifless"

[buildPlans.iosevka-n.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.iosevka-n.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.iosevka-n.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.iosevka-n.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.iosevka-n.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

